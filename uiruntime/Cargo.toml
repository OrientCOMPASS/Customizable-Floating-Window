[package]
name = "cfw-uiruntime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Slint UI runtime for the floating window: theme compilation, contract binding, drag/tracking, window flags. Runs on a plugin-owned thread (Windows/Linux) or as the helper process main loop (macOS)."
publish = false

[dependencies]
cfw-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
pollster = "1.0"
png = "0.18"
raw-window-handle = "0.6"
slint = { version = "1.18.1", default-features = false, features = [
    "std", "backend-winit", "renderer-software", "raw-window-handle-06", "compat-1-2",
] }
slint-interpreter = { version = "1.18.1", default-features = false, features = [
    "backend-winit", "renderer-software", "raw-window-handle-06", "compat-1-2",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
