# Release workflow — Focus-Capture distribution model.
#
#   push (main/dev)        → builds only; publishes the Actions artifact
#                            `customizable-floating-window-development` whose
#                            zip root IS the install bundle (open = plugin dir;
#                            no nested zip).
#   manual run (dispatch)  → additionally creates a GitHub Release tagged
#                            v<version from plugin.json> with assets:
#                              plugin.zip  (same bundle, installable)
#                              plugin.json (update/market manifest — the very
#                                           same json shipped inside the zip)
#
# The repo-root plugin.json is the single source of truth for install,
# release (updateUrl → .../releases/latest/download/plugin.json) and the
# marketplace entry (Focus-Capture model).
#
# Matrix: three desktop platforms (no macOS x86_64, per project decision).
# Zip layout (root = plugin install dir):
#   plugin.json, panel.html, LICENSE, README.md, themes/*.slint,
#   customizable_floating_window.{dll,so,dylib}   (host auto-completes suffix)
#   bin/floating-helper-{windows-x86_64.exe, linux-x86_64, macos-aarch64}

name: release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as prerelease"
        required: false
        default: "false"

env:
  PLUGIN_ID: opss.customizable-floating-window

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            helper: floating-helper-windows-x86_64.exe
            libext: dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            helper: floating-helper-linux-x86_64
            libext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            helper: floating-helper-macos-aarch64
            libext: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps (Slint fontconfig build dep + X11 runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev pkg-config zip \
            libx11-6 libxkbcommon0 libxkbcommon-x11-0

      - name: Workflow lint (actionlint)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/latest/download/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint .github/workflows/release.yml

      - name: Test (unit + theme contract)
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Theme compile-check (headless, linux)
        if: runner.os == 'Linux'
        run: |
          for t in themes/*.slint; do
            ./target/${{ matrix.target }}/release/floating_helper --compile-check "$t"
          done

      - name: Normalize artifacts
        shell: bash
        run: |
          set -e
          OUT=out
          mkdir -p $OUT/bin
          LIB=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp $LIB/customizable_floating_window.${{ matrix.libext }} \
               $OUT/customizable_floating_window.${{ matrix.libext }}
            cp $LIB/floating_helper.exe $OUT/bin/${{ matrix.helper }}
          else
            # strip the unix lib prefix so the host's auto-extension works
            cp $LIB/libcustomizable_floating_window.${{ matrix.libext }} \
               $OUT/customizable_floating_window.${{ matrix.libext }}
            cp $LIB/floating_helper $OUT/bin/${{ matrix.helper }}
            chmod +x $OUT/bin/${{ matrix.helper }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble install bundle (zip root = plugin dir)
        run: |
          set -e
          ST=stage
          rm -rf $ST && mkdir -p $ST/bin $ST/themes
          # shared root files — plugin.json verbatim from the repo root
          cp plugin.json panel.html LICENSE README.md $ST/
          cp themes/*.slint $ST/themes/
          for t in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            cp artifacts/build-$t/customizable_floating_window.* $ST/
            cp artifacts/build-$t/bin/* $ST/bin/
          done
          ls -la $ST $ST/bin
          # development artifact: the bundle directory itself (no nesting)
          mkdir -p devartifact
          cp -r $ST/* devartifact/
          # release asset zip
          ( cd $ST && zip -qr ../plugin.zip . )
          mkdir -p rel
          cp plugin.zip rel/plugin.zip
          cp plugin.json rel/plugin.json
      - uses: actions/upload-artifact@v4
        with:
          name: customizable-floating-window-development
          path: devartifact/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: rel/

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-assets }
      - name: Tag v<manifest version>
        id: tag
        run: |
          V=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          git tag "v$V" || echo "tag exists — release will reuse it"
          git push origin "v$V" || true
      - name: Publish release (plugin.zip + same plugin.json as update manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            plugin.zip
            plugin.json
          generate_release_notes: true
