# Release workflow — three desktop platforms, single cross-platform zip.
#
# push (main/dev)  → development artifact only (no release/tag)
# tag  v*          → GitHub Release with plugin.zip (+ plugin.json snapshot)
#
# Layout inside plugin.zip (root = plugin install dir):
#   plugin.json, panel.html, themes/*.slint,
#   customizable_floating_window.{dll,so,dylib}   (host auto-completes suffix)
#   bin/floating-helper-{windows-x86_64.exe,linux-x86_64,macos-aarch64,macos-x86_64}
#
# NOTE: the macOS entries share one slot per OS in the zip consumer model used
# by MicYou (one entry file per platform); CI publishes TWO zips when both
# mac arches are needed: plugin-macos-aarch64.zip / plugin-macos-x86_64.zip,
# plus plugin.zip (windows+linux+macos-aarch64) as the default bundle.

name: release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "none|patch|minor|major"
        required: false
        default: "none"

env:
  PLUGIN_ID: opss.customizable-floating-window

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            helper: floating-helper-windows-x86_64.exe
            libext: dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            helper: floating-helper-linux-x86_64
            libext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            helper: floating-helper-macos-aarch64
            libext: dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            helper: floating-helper-macos-x86_64
            libext: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps (Slint fontconfig + X11 runtime dlopen libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev pkg-config \
            libx11-6 libxkbcommon0 libxkbcommon-x11-0

      - name: Test (unit + theme contract)
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Normalize artifacts
        shell: bash
        run: |
          set -e
          OUT=out
          mkdir -p $OUT/bin $OUT/themes
          cp plugin.json panel.html LICENSE README.md $OUT/
          cp -r themes/*.slint $OUT/themes/
          LIB=target/${{ matrix.target }}/release/
          # cdylib: strip the lib prefix on unix so the host's auto-extension works
          if [ "${{ matrix.libext }}" = "dll" ]; then
            cp ${LIB}customizable_floating_window.dll $OUT/customizable_floating_window.dll
            cp ${LIB}floating_helper.exe $OUT/bin/${{ matrix.helper }}
          else
            cp ${LIB}libcustomizable_floating_window.${{ matrix.libext }} \
               $OUT/customizable_floating_window.${{ matrix.libext }}
            cp ${LIB}floating_helper $OUT/bin/${{ matrix.helper }}
            chmod +x $OUT/bin/${{ matrix.helper }}
          fi
          # merge per-OS duplicate dylibs into one slot later (package job)

      - name: Theme compile-check (linux only, headless)
        if: runner.os == 'Linux'
        run: |
          for t in themes/*.slint; do
            ./target/${{ matrix.target }}/release/floating_helper --compile-check "$t"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: out/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble zips
        run: |
          set -e
          mkdir -p stage
          # default bundle: windows + linux + macos arm64
          rm -rf stage/default && mkdir -p stage/default
          for t in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            cp -r artifacts/plugin-$t/* stage/default/
          done
          (cd stage/default && zip -qr ../../plugin.zip .)
          # mac x86_64 variant zip (windows + linux + mac x86_64)
          rm -rf stage/macx64 && mkdir -p stage/macx64
          cp -r artifacts/plugin-x86_64-pc-windows-msvc/* stage/macx64/
          cp -r artifacts/plugin-x86_64-unknown-linux-gnu/* stage/macx64/
          cp -r artifacts/plugin-x86_64-apple-darwin/* stage/macx64/
          (cd stage/macx64 && zip -qr ../../plugin-macos-x86_64.zip .)
          cp plugin.json plugin-manifest.json
          ls -la *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: |
            plugin.zip
            plugin-macos-x86_64.zip
            plugin-manifest.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: plugin-zips }
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin.zip
            plugin-macos-x86_64.zip
            plugin-manifest.json
          generate_release_notes: true
