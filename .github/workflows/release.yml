# Release workflow — three desktop platforms, ONE cross-platform plugin.zip.
#
# The repo-root plugin.json is the single source of truth: the same file is
#   · shipped inside plugin.zip (install manifest),
#   · uploaded as a release asset (update manifest: manifest.updateUrl points
#     at .../releases/latest/download/plugin.json),
#   · PR'd to the MicYou marketplace index (market entry).
# (Focus-Capture distribution model.)
#
# push (main/dev) → development artifact only (no release/tag)
# tag  v*         → GitHub Release with plugin.zip + plugin.json
#
# Zip layout (root = plugin install dir):
#   plugin.json, panel.html, LICENSE, README.md, themes/*.slint,
#   customizable_floating_window.{dll,so,dylib}   (host auto-completes suffix)
#   bin/floating-helper-{windows-x86_64.exe, linux-x86_64, macos-aarch64}

name: release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  PLUGIN_ID: opss.customizable-floating-window

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            helper: floating-helper-windows-x86_64.exe
            libname: customizable_floating_window.dll
            libext: dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            helper: floating-helper-linux-x86_64
            libname: customizable_floating_window.so
            libext: so
          - os: macos-latest
            target: aarch64-apple-darwin
            helper: floating-helper-macos-aarch64
            libname: customizable_floating_window.dylib
            libext: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps (Slint fontconfig build dep + X11 runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev pkg-config zip \
            libx11-6 libxkbcommon0 libxkbcommon-x11-0

      - name: Test (unit + theme contract)
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Theme compile-check (headless, linux)
        if: runner.os == 'Linux'
        run: |
          for t in themes/*.slint; do
            ./target/${{ matrix.target }}/release/floating_helper --compile-check "$t"
          done

      - name: Normalize artifacts
        shell: bash
        run: |
          set -e
          OUT=out
          mkdir -p $OUT/bin $OUT/themes
          LIB=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp $LIB/customizable_floating_window.${{ matrix.libext }} \
               $OUT/${{ matrix.libname }}
            cp $LIB/floating_helper.exe $OUT/bin/${{ matrix.helper }}
          else
            # strip the unix lib prefix so the host's auto-extension works
            cp $LIB/libcustomizable_floating_window.${{ matrix.libext }} \
               $OUT/${{ matrix.libname }}
            cp $LIB/floating_helper $OUT/bin/${{ matrix.helper }}
            chmod +x $OUT/bin/${{ matrix.helper }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble plugin.zip (single json for install/release/market)
        run: |
          set -e
          ST=stage
          rm -rf $ST && mkdir -p $ST/bin $ST/themes
          # shared root files — plugin.json verbatim from the repo root
          cp plugin.json panel.html LICENSE README.md $ST/
          cp themes/*.slint $ST/themes/
          # per-platform binaries
          for t in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            cp artifacts/build-$t/customizable_floating_window.* $ST/ 2>/dev/null || true
            cp artifacts/build-$t/bin/* $ST/bin/
          done
          ls -la $ST $ST/bin
          ( cd $ST && zip -qr ../plugin.zip . )
          # release/market manifest = the very same json, asset-named
          mkdir -p rel
          cp plugin.zip rel/plugin.zip
          cp plugin.json rel/plugin.json
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: rel/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: plugin-package }
      # plugin.zip = install bundle; plugin.json = update/market manifest
      # (identical to the json inside the zip and at the repo root).
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin.zip
            plugin.json
          generate_release_notes: true
