<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>悬浮窗设置 · Customizable Floating Window</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 20px 32px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: hsl(var(--on-surface));
    background: transparent;
    font-size: 14px; line-height: 1.55;
  }
  h2 { margin: 0 0 2px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .sub { color: hsl(var(--on-surface-variant)); font-size: 12px; margin-bottom: 16px; }
  .card {
    border: 1px solid hsl(var(--border));
    background: hsl(var(--surface-container));
    border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 10px; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .row label.key { flex: none; min-width: 76px; color: hsl(var(--on-surface-variant)); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button {
    border: 1px solid hsl(var(--outline)); background: hsl(var(--surface-bright));
    color: hsl(var(--on-surface)); padding: 7px 14px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  button.primary { background: hsl(var(--primary)); color: hsl(var(--on-primary)); border-color: transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid hsl(var(--outline)); color: hsl(var(--on-surface-variant));
  }
  .badge.ok { color: hsl(var(--primary)); border-color: hsl(var(--primary)); }
  .badge.err { color: hsl(var(--error)); border-color: hsl(var(--error)); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; }
  .kv .k { color: hsl(var(--on-surface-variant)); }
  .kv .v { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .errbox {
    display: none; margin-top: 10px; padding: 8px 12px; border-radius: 10px;
    background: hsl(var(--error) / .1); color: hsl(var(--error)); font-size: 12.5px;
    white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
    overflow-wrap: anywhere;
  }
  .themes { display: flex; flex-direction: column; gap: 4px; max-height: 170px; overflow: auto; }
  .themes label {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; cursor: pointer;
  }
  .themes label:hover { background: hsl(var(--surface-variant) / .5); }
  .themes input { accent-color: hsl(var(--primary)); }
  .themes .cur { color: hsl(var(--on-surface-variant)); font-size: 11px; }
  textarea {
    width: 100%; min-height: 180px; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px;
    color: hsl(var(--on-surface)); background: hsl(var(--surface-dim) / .35);
    border: 1px solid hsl(var(--outline)); border-radius: 10px; padding: 10px;
  }
  input[type=text] {
    border: 1px solid hsl(var(--outline)); border-radius: 8px; padding: 6px 10px;
    color: hsl(var(--on-surface)); background: hsl(var(--surface-dim) / .35); font-size: 13px;
    width: 100%;
  }
  input[type=range] { flex: 1; min-width: 120px; accent-color: hsl(var(--primary)); }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: hsl(var(--on-surface-variant)); font-size: 13px; }
  pre {
    background: hsl(var(--surface-dim) / .35); border: 1px solid hsl(var(--border));
    border-radius: 10px; padding: 10px; overflow: auto; font-size: 11.5px; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  code {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    background: hsl(var(--surface-dim) / .5); padding: 1px 6px; border-radius: 6px;
    overflow-wrap: anywhere;
  }
  .hint { color: hsl(var(--on-surface-variant)); font-size: 12px; margin-top: 6px; }
  .bar { height: 6px; border-radius: 3px; background: hsl(var(--surface-variant)); overflow: hidden; }
  .bar > div { height: 100%; background: hsl(var(--primary)); width: 0%; transition: width .12s linear; }
  .switch { display: flex; align-items: center; gap: 8px; }
  .switch input { accent-color: hsl(var(--primary)); width: 16px; height: 16px; }
  .ai-tip {
    border: 1px dashed hsl(var(--primary)); border-radius: 12px;
    padding: 10px 12px; font-size: 12.5px; background: hsl(var(--primary) / .06);
  }
  .ai-tip b { color: hsl(var(--primary)); }
  .pathbox { margin-top: 8px; font-size: 12px; color: hsl(var(--on-surface-variant)); }
</style>
</head>
<body>
  <h2>🪟 <span id="title">可自定义悬浮窗</span></h2>
  <div class="sub" id="subTitle">Slint 主题驱动的透明悬浮窗 · 状态监视与静音/耳返控制</div>

  <div class="card">
    <div class="row" style="margin-top:0">
      <span class="badge" id="stateBadge">…</span>
      <span style="flex:1"></span>
      <button id="btnShow"></button>
      <button id="btnRestart"></button>
    </div>
    <div class="kv" style="margin-top:10px">
      <span class="k" id="kStream">串流</span><span class="v" id="vStream">–</span>
      <span class="k" id="kLevel">输入电平</span>
      <span class="v"><span class="bar" style="display:inline-block;width:120px;vertical-align:middle"><div id="vLevelBar"></div></span> <span id="vLevel">–</span></span>
      <span class="k" id="kMute">静音</span><span class="v" id="vMute">–</span>
      <span class="k" id="kMon">耳返</span><span class="v" id="vMon">–</span>
      <span class="k" id="kSession">本次连接</span><span class="v" id="vSession">–</span>
      <span class="k" id="kDev">设备</span><span class="v" id="vDev">–</span>
      <span class="k" id="kFmt">格式</span><span class="v" id="vFmt">–</span>
    </div>
    <div class="errbox" id="errBox"></div>
  </div>

  <div class="card">
    <h3 id="hEdit">修改主题（推荐方式）</h3>
    <div class="ai-tip">
      <b id="aiTipTitle">优先使用 AI / LLM 修改主题。</b>
      <span id="aiTipBody">.slint 是声明式 UI 语言：把目标主题文件与「主题契约」一起交给 AI 助手
      （或直接用文本编辑器）修改，保存后回到本面板点「热重载当前主题」即可生效，无需重启。</span>
    </div>
    <div class="pathbox">
      <span id="pathLabel">主题文件目录：</span><code id="themesDir">…</code>
    </div>
    <div class="hint" id="editHint"></div>
  </div>

  <div class="card">
    <h3 id="hTheme">切换主题（.slint）</h3>
    <div class="themes" id="themeList"></div>
    <div class="actions">
      <button class="primary" id="btnApply"></button>
      <button id="btnReload"></button>
      <button id="btnRestore"></button>
      <button id="btnResetPos"></button>
    </div>
    <div class="hint" id="themeHint"></div>
  </div>

  <div class="card">
    <h3 id="hEditor">在线编辑器（仅快速微调）</h3>
    <div class="row">
      <label class="key" id="kName">文件名</label>
      <input type="text" id="themeName" placeholder="my-theme.slint" />
    </div>
    <textarea id="themeSrc" spellcheck="false"></textarea>
    <div class="actions">
      <button class="primary" id="btnSave"></button>
      <button id="btnLoadCur"></button>
    </div>
    <div class="hint" id="editorHint"></div>
    <details>
      <summary id="sumContract">主题契约（可用属性 / 回调）</summary>
      <pre id="contractPre"></pre>
    </details>
  </div>

  <div class="card">
    <h3 id="hOpts">选项</h3>
    <div class="row switch">
      <input type="checkbox" id="chkVisible" />
      <label for="chkVisible" id="lblVisible" style="min-width:0">显示悬浮窗</label>
    </div>
    <div class="row">
      <label class="key" id="lblTick">刷新间隔</label>
      <input type="range" id="rngTick" min="50" max="1000" step="10" />
      <span id="vTick" style="min-width:52px;text-align:right;font-variant-numeric:tabular-nums"></span>
    </div>
  </div>

<script>
// ── postMessage bridge (see MicYou usePluginPanelBridge) ─────────────
function call(api, args) {
  return new Promise((resolve, reject) => {
    const id = Math.random().toString(36).slice(2);
    const onMsg = (e) => {
      if (e.data && e.data.__micyou === 1 && e.data.id === id) {
        window.removeEventListener('message', onMsg);
        e.data.ok ? resolve(e.data.value) : reject(new Error(e.data.error));
      }
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ __micyou: 1, id, api, args: args || {} }, '*');
  });
}
const $ = (id) => document.getElementById(id);
let L = {};
let cfg = {};
let locale = 'zh';

const STR = {
  zh: {
    title: '可自定义悬浮窗', sub: 'Slint 主题驱动的透明悬浮窗 · 状态监视与静音/耳返控制',
    show: '显示', hide: '隐藏', restart: '重启悬浮窗', apply: '应用所选主题',
    reload: '热重载当前主题', restore: '恢复内置主题', resetPos: '位置复位',
    hEdit: '修改主题（推荐方式）',
    aiTipTitle: '优先使用 AI / LLM 修改主题。',
    aiTipBody: '.slint 是声明式 UI 语言：把目标主题文件与下方「主题契约」一起交给 AI 助手（或直接用文本编辑器）修改，保存后点「热重载当前主题」即可生效，无需重启 MicYou。',
    pathLabel: '主题文件目录：',
    editHint: '直接增删该目录下的 .slint 文件亦可：主题列表约 5 秒内自动刷新。面板在线编辑器仅适合快速微调，复杂修改请走文件 + AI 路线。',
    hTheme: '切换主题（.slint）', hEditor: '在线编辑器（仅快速微调）', hOpts: '选项',
    kName: '文件名', save: '保存为新主题', loadCur: '载入所选主题到编辑器',
    lblVisible: '显示悬浮窗', lblTick: '刷新间隔',
    kStream: '串流', kLevel: '输入电平', kMute: '静音', kMon: '耳返',
    kSession: '本次连接', kDev: '设备', kFmt: '格式',
    yes: '是', no: '否', on: '开', off: '关', none: '–',
    themeHint: '切换为热替换：编译通过立即换窗，编译失败保留当前窗并在上方红框给出诊断。',
    editorHint: '保存后立即出现在主题列表中（不会自动切换）。文件名仅允许字母数字 . _ - 且以 .slint 结尾。',
    sumContract: '主题契约（可用属性 / 回调，全部可选）',
    errTitle: '主题错误：',
    confirmRestore: '覆盖 themes/ 中的内置主题文件（ring/pill/minimal.slint）？自定义文件不受影响。',
    st: { running: '运行中', starting: '启动中', crashed: '已崩溃', hidden: '已隐藏', missing: '缺少 helper', stopped: '已停止', idle: '未启用' },
  },
  en: {
    title: 'Customizable Floating Window', sub: 'Slint-themed transparent HUD · status monitoring + mute/monitoring control',
    show: 'Show', hide: 'Hide', restart: 'Restart', apply: 'Apply selected',
    reload: 'Hot-reload theme', restore: 'Restore built-ins', resetPos: 'Reset position',
    hEdit: 'Editing themes (recommended)',
    aiTipTitle: 'Prefer an AI / LLM for theme edits.',
    aiTipBody: '.slint is a declarative UI language: hand the theme file plus the contract below to your AI assistant (or edit it in any text editor), save, then press “Hot-reload theme” — no restart needed.',
    pathLabel: 'Theme directory: ',
    editHint: 'You can also add/remove .slint files in that directory directly; the list refreshes within ~5 s. The in-panel editor is meant for quick tweaks only.',
    hTheme: 'Switch theme (.slint)', hEditor: 'In-panel editor (quick tweaks only)', hOpts: 'Options',
    kName: 'File name', save: 'Save as new theme', loadCur: 'Load selected into editor',
    lblVisible: 'Show floating window', lblTick: 'Refresh interval',
    kStream: 'Streaming', kLevel: 'Input level', kMute: 'Muted', kMon: 'Monitoring',
    kSession: 'Session', kDev: 'Device', kFmt: 'Format',
    yes: 'yes', no: 'no', on: 'on', off: 'off', none: '–',
    themeHint: 'Switching hot-swaps: a compiling theme replaces the window instantly; on error the current window stays and diagnostics appear above.',
    editorHint: 'Saved themes appear in the list (not auto-applied). Names: alnum . _ - and .slint suffix.',
    sumContract: 'Theme contract (properties / callbacks — all optional)',
    errTitle: 'Theme error: ',
    confirmRestore: 'Overwrite built-in themes (ring/pill/minimal.slint)? Custom files stay untouched.',
    st: { running: 'running', starting: 'starting', crashed: 'crashed', hidden: 'hidden', missing: 'helper missing', stopped: 'stopped', idle: 'disabled' },
  },
};

const CONTRACT = `输入属性 (in property，缺失即忽略):
  input-level float      原始输入电平 0..1
  processed-level float  处理后电平 0..1
  smooth-level float     平滑电平 (~30Hz EMA，helper 侧)
  level-percent int      smooth-level × 100
  muted bool             宿主静音态（权威）
  streaming bool         音频会话串流中
  monitoring bool        宿主耳返态
  sample-rate int        Hz
  channels int
  queued-ms float        输出队列延迟
  session-seconds int    本次连接时长（秒）
  session-text string    "M:SS" / "H:MM:SS"
  device-label string    已连接设备名
  device-mode string     wifi / usb / web
  info-text string       "48.0kHz · 1ch · q13ms"
  arc-path string        100×100 视图框圆弧 SVG path（r=45, 12 点起顺时针, 随 smooth-level）
  bars-path string       100×100 视图框 8 根旋转波形条线段（helper ~30Hz 推进相位）

输出回调 (callback，主题内自行触发):
  mute-toggle()              切换宿主静音
  monitoring-toggle()        切换耳返
  menu-action(string)        自定义菜单动作（"reload-theme" 内置）
  hide-window()              隐藏悬浮窗（并持久化 visible=false）
  drag-start(float, float)   按下：窗内鼠标坐标（逻辑 px）= 抓取锚点
  drag-move(float, float)    移动中：窗内鼠标当前坐标（helper 据此 1:1 跟窗）
  drag-end()                 拖动结束（上报位置持久化）

交互约定（ring/minimal 内置）:
  左键单击(移动事件<2) = 切静音；左键拖动 = 移窗；右键 = 切耳返。
  也可用 WindowMoveArea 做系统级拖动（见 pill.slint，Wayland 推荐）。

窗口属性建议:
  no-frame: true;  always-on-top: true;  background: transparent;
  （"不占任务栏" 由 helper 在窗口层处理：Win WS_EX_TOOLWINDOW+DWM /
    X11 SKIP_TASKBAR+MOTIF / macOS Accessory+borderless；Wayland 由合成器决定）

注意：Slint 1.18 软件渲染器不支持元素旋转（transform-rotation 被忽略），
      斜线/旋转几何请用 Path 线段（静态 commands 或 helper 的 arc/bars-path）。`;

function t(k) { return (L[k] ?? STR.en[k] ?? k); }
function fmtBool(v, on, off) { return v ? on : off; }

function renderThemeList() {
  const list = Array.isArray(cfg.themeList) ? cfg.themeList : [];
  const cur = cfg.theme || 'ring.slint';
  const box = $('themeList');
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="hint">themes/ empty — press “Restore built-ins”</div>';
    return;
  }
  for (const name of list) {
    const lab = document.createElement('label');
    const rad = document.createElement('input');
    rad.type = 'radio'; rad.name = 'theme'; rad.value = name;
    rad.checked = (name === cur);
    rad.addEventListener('change', () => selectTheme(name));
    lab.appendChild(rad);
    lab.appendChild(document.createTextNode(name));
    if (name === cur) {
      const s = document.createElement('span');
      s.className = 'cur'; s.textContent = '●';
      lab.appendChild(s);
    }
    box.appendChild(lab);
  }
}

function renderStatus() {
  const st = cfg.status || {};
  const hs = cfg.helperState || 'idle';
  const badge = $('stateBadge');
  badge.textContent = (L.st && L.st[hs]) || hs;
  badge.className = 'badge ' + (hs === 'running' ? 'ok' : (hs === 'crashed' || hs === 'missing' ? 'err' : ''));
  $('btnShow').textContent = cfg.visible ? t('hide') : t('show');
  $('vStream').textContent = st.streaming == null ? t('none') : fmtBool(st.streaming, t('yes'), t('no'));
  const lvl = st.level == null ? 0 : st.level;
  $('vLevelBar').style.width = Math.round(Math.min(1, lvl) * 100) + '%';
  $('vLevel').textContent = st.level == null ? t('none') : (lvl * 100).toFixed(0) + '%';
  $('vMute').textContent = st.muted == null ? t('none') : fmtBool(st.muted, t('yes'), t('no'));
  $('vMon').textContent = st.monitoring == null ? t('none') : fmtBool(st.monitoring, t('on'), t('off'));
  $('vSession').textContent = st.sessionText || t('none');
  $('vDev').textContent = st.deviceLabel || t('none');
  $('vFmt').textContent = st.sampleRate ? (st.sampleRate / 1000).toFixed(1) + 'kHz · ' + st.channels + 'ch · q' + (st.queuedMs ?? 0).toFixed(0) + 'ms' : t('none');
  const err = cfg.themeError || '';
  const eb = $('errBox');
  eb.style.display = err ? 'block' : 'none';
  eb.textContent = err ? t('errTitle') + err : '';
  $('chkVisible').checked = !!cfg.visible;
  const ms = cfg.updateMs ?? 100;
  $('rngTick').value = ms;
  $('vTick').textContent = ms + ' ms';
  $('themesDir').textContent = cfg.themesDir || '…';
}

function applyLocale() {
  L = (locale || '').startsWith('zh') ? STR.zh : STR.en;
  for (const [id, key] of [
    ['title','title'],['subTitle','sub'],['btnRestart','restart'],['btnApply','apply'],
    ['btnReload','reload'],['btnRestore','restore'],['btnResetPos','resetPos'],
    ['hEdit','hEdit'],['aiTipTitle','aiTipTitle'],['aiTipBody','aiTipBody'],
    ['pathLabel','pathLabel'],['editHint','editHint'],
    ['hTheme','hTheme'],['hEditor','hEditor'],['hOpts','hOpts'],
    ['kName','kName'],['btnSave','save'],['btnLoadCur','loadCur'],
    ['lblVisible','lblVisible'],['lblTick','lblTick'],
    ['kStream','kStream'],['kLevel','kLevel'],['kMute','kMute'],['kMon','kMon'],
    ['kSession','kSession'],['kDev','kDev'],['kFmt','kFmt'],
    ['themeHint','themeHint'],['editorHint','editorHint'],['sumContract','sumContract'],
  ]) {
    const el = $(id);
    if (el) el.textContent = t(key);
  }
  $('contractPre').textContent = CONTRACT;
  renderStatus();
}

async function selectTheme(name) {
  await call('set_config', { key: 'theme', value: name });
  await call('trigger', { action: 'apply-theme' });
}
async function refresh() {
  try {
    const next = await call('get_config', {});
    const changedList = JSON.stringify((next || {}).themeList) !== JSON.stringify((cfg || {}).themeList)
      || (next || {}).theme !== (cfg || {}).theme;
    cfg = next || {};
    if (changedList) renderThemeList();
    renderStatus();
  } catch (e) { /* host not ready */ }
}

async function main() {
  try { locale = await call('locale', {}) || 'zh'; } catch (e) { locale = 'zh'; }
  applyLocale();
  await refresh();
  renderThemeList();

  $('btnShow').onclick = async () => {
    await call('trigger', { action: cfg.visible ? 'hide' : 'show' });
    refresh();
  };
  $('btnRestart').onclick = async () => { await call('trigger', { action: 'restart-helper' }); refresh(); };
  $('btnApply').onclick = async () => {
    const sel = document.querySelector('input[name=theme]:checked');
    if (sel) await selectTheme(sel.value);
    refresh();
  };
  $('btnReload').onclick = async () => { await call('trigger', { action: 'reload' }); refresh(); };
  $('btnRestore').onclick = async () => {
    if (!confirm(t('confirmRestore'))) return;
    await call('trigger', { action: 'restore-themes' });
    refresh();
  };
  $('btnResetPos').onclick = async () => { await call('trigger', { action: 'reset-pos' }); refresh(); };
  $('btnSave').onclick = async () => {
    let name = $('themeName').value.trim();
    if (!name) { alert(locale.startsWith('zh') ? '请填写文件名' : 'File name required'); return; }
    if (!name.endsWith('.slint')) name += '.slint';
    await call('set_config', { key: 'themeDraftName', value: name });
    await call('set_config', { key: 'themeDraft', value: $('themeSrc').value });
    await call('trigger', { action: 'save-theme' });
    refresh();
  };
  $('btnLoadCur').onclick = async () => {
    const sel = document.querySelector('input[name=theme]:checked');
    if (!sel) return;
    $('themeName').value = sel.value;
    await call('set_config', { key: 'themeDraftName', value: sel.value });
    await call('trigger', { action: 'stage-theme' });
    setTimeout(async () => {
      await refresh();
      if (typeof cfg.themeDraft === 'string') $('themeSrc').value = cfg.themeDraft;
    }, 400);
  };
  $('chkVisible').onchange = async (e) => {
    await call('trigger', { action: e.target.checked ? 'show' : 'hide' });
    refresh();
  };
  $('rngTick').oninput = (e) => { $('vTick').textContent = e.target.value + ' ms'; };
  $('rngTick').onchange = async (e) => {
    await call('set_config', { key: 'updateMs', value: Number(e.target.value) });
    refresh();
  };

  setInterval(refresh, 1000);
}
main();
</script>
</body>
</html>
