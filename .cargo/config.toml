# Cross-compilation helper for the Windows GNU target (local dev / CI caches).
# CI itself builds Windows on windows-latest with MSVC; this only makes
# `--target x86_64-pc-windows-gnu` work from Linux boxes.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
